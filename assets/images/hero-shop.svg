<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1209"/>
      <stop offset="0.7" stop-color="#0e0a07"/>
      <stop offset="1" stop-color="#0a0806"/>
    </linearGradient>
    <radialGradient id="nightGlow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#3a2414" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0a0806" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a2b"/>
      <stop offset="0.35" stop-color="#e8c87c"/>
      <stop offset="0.55" stop-color="#f5e0a4"/>
      <stop offset="0.75" stop-color="#c9a24b"/>
      <stop offset="1" stop-color="#7a5c24"/>
    </linearGradient>
    <linearGradient id="maroon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a1a2b"/>
      <stop offset="1" stop-color="#4a0e18"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb45c" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#ffcf7e" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#nightGlow)"/>
  <rect y="820" width="1600" height="80" fill="#070504"/>

  <g fill="url(#gold)" opacity="0.9">
    <circle cx="120" cy="150" r="1.6"/><circle cx="300" cy="90" r="1.2"/><circle cx="490" cy="140" r="1.4"/>
    <circle cx="760" cy="70" r="1.8"/><circle cx="1030" cy="120" r="1.2"/><circle cx="1280" cy="95" r="1.5"/>
    <circle cx="1460" cy="160" r="1.3"/><circle cx="90" cy="340" r="1.1"/><circle cx="1520" cy="300" r="1.4"/>
  </g>

  <!-- building -->
  <rect x="210" y="170" width="1180" height="650" fill="#17100b" stroke="url(#gold)" stroke-width="3"/>
  <rect x="180" y="150" width="1240" height="46" fill="#1e1510" stroke="url(#gold)" stroke-width="3"/>
  <rect x="230" y="180" width="1140" height="12" fill="url(#gold)"/>
  <line x1="230" y1="560" x2="1370" y2="560" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>

  <!-- signboard -->
  <rect x="330" y="262" width="940" height="118" rx="6" fill="url(#maroon)" stroke="url(#gold)" stroke-width="4"/>
  <line x1="330" y1="262" x2="1270" y2="262" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>
  <text x="800" y="334" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" letter-spacing="10" fill="url(#gold)" font-weight="600">BHANU PRAKASH JEWELERS</text>
  <line x1="420" y1="380" x2="1180" y2="380" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="800" y="408" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="14" fill="#e9c98d">GOLD &amp; SILVER JEWELLERY</text>

  <!-- awning -->
  <path d="M300 462 L1300 462 L1300 520 L300 520 Z" fill="#3a0f18" stroke="url(#gold)" stroke-width="2"/>
  <g>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8c87c"/><stop offset="1" stop-color="#b08a3d"/></linearGradient>
    <rect x="305" y="466" width="82" height="50" fill="url(#stripe)"/>
    <rect x="395" y="466" width="82" height="50" fill="#4a0e18"/>
    <rect x="485" y="466" width="82" height="50" fill="url(#stripe)"/>
    <rect x="575" y="466" width="82" height="50" fill="#4a0e18"/>
    <rect x="665" y="466" width="82" height="50" fill="url(#stripe)"/>
    <rect x="755" y="466" width="82" height="50" fill="#4a0e18"/>
    <rect x="845" y="466" width="82" height="50" fill="url(#stripe)"/>
    <rect x="935" y="466" width="82" height="50" fill="#4a0e18"/>
    <rect x="1025" y="466" width="82" height="50" fill="url(#stripe)"/>
    <rect x="1115" y="466" width="82" height="50" fill="#4a0e18"/>
    <rect x="1205" y="466" width="82" height="50" fill="url(#stripe)"/>
  </g>

  <!-- window with warm showroom -->
  <rect x="330" y="540" width="640" height="290" fill="#241207" stroke="url(#gold)" stroke-width="3"/>
  <rect x="330" y="540" width="640" height="290" fill="url(#warm)"/>
  <line x1="650" y1="540" x2="650" y2="830" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>
  <line x1="330" y1="690" x2="970" y2="690" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>

  <!-- necklaces hanging in window -->
  <g stroke="url(#gold)" fill="none" stroke-width="5" opacity="0.85">
    <path d="M430 560 Q470 640 455 700 Q440 660 400 620 Q415 580 430 560"/>
    <path d="M470 560 Q500 630 490 690 Q480 655 455 620"/>
  </g>
  <circle cx="497" cy="584" r="7" fill="url(#gold)"/>
  <circle cx="445" cy="648" r="5" fill="url(#gold)"/>
  <circle cx="760" cy="612" r="20" stroke="url(#gold)" stroke-width="6" fill="none" opacity="0.8"/>
  <circle cx="885" cy="700" r="16" stroke="url(#gold)" stroke-width="6" fill="none" opacity="0.8"/>
  <path d="M860 560 Q895 620 885 690 Q875 640 850 605" stroke="url(#gold)" stroke-width="5" fill="none" opacity="0.8"/>

  <!-- door -->
  <path d="M1120 830 L1120 660 Q1220 620 1320 660 L1320 830 Z" fill="#1a120c" stroke="url(#gold)" stroke-width="3"/>
  <line x1="1295" y1="760" x2="1295" y2="780" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="1132" cy="770" r="4" fill="url(#gold)"/>
  <rect x="1120" y="700" width="200" height="10" fill="url(#gold)" opacity="0.4"/>

  <!-- steps -->
  <rect x="1120" y="830" width="200" height="18" fill="#24170e" stroke="url(#gold)" stroke-width="1.5"/>
  <rect x="1095" y="848" width="250" height="18" fill="#1d120a" stroke="url(#gold)" stroke-width="1.5"/>

  <!-- lamps -->
  <circle cx="300" cy="520" r="6" fill="#ffcf7e"/><circle cx="300" cy="520" r="14" fill="#ffcf7e" opacity="0.25"/>
  <circle cx="1300" cy="520" r="6" fill="#ffcf7e"/><circle cx="1300" cy="520" r="14" fill="#ffcf7e" opacity="0.25"/>

  <!-- caption -->
  <text x="800" y="882" text-anchor="middle" font-family="Georgia, serif" font-size="20" letter-spacing="6" fill="#8a6a2b">SHOP PHOTOGRAPH — REPLACE WITH REAL STOREFRONT IMAGE</text>
</svg>