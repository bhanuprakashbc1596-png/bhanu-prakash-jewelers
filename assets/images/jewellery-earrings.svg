<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#24170a"/>
      <stop offset="0.55" stop-color="#130d06"/>
      <stop offset="1" stop-color="#0a0705"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.32">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a2b"/>
      <stop offset="0.35" stop-color="#e8c87c"/>
      <stop offset="0.55" stop-color="#f7e3a8"/>
      <stop offset="0.75" stop-color="#c9a24b"/>
      <stop offset="1" stop-color="#7a5c24"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c87c"/>
      <stop offset="1" stop-color="#8a6a2b"/>
    </linearGradient>
    <radialGradient id="stone" cx="0.38" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#fff3d4"/>
      <stop offset="0.6" stop-color="#f2d493"/>
      <stop offset="1" stop-color="#b8913d"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>

  <!-- left earring -->
  <g style="transform: translate(-40px,0)">
    <path d="M300 260 L300 330" stroke="url(#gold)" stroke-width="5"/>
    <circle cx="300" cy="345" r="8" fill="url(#gold)" stroke="url(#gold)" stroke-width="3"/>
    <path d="M270 400 L330 400 L300 640 Z" fill="none" stroke="url(#gold)" stroke-width="6"/>
    <path d="M276 400 L324 400 L300 622 Z" fill="url(#goldV)" opacity="0.8"/>
    <circle cx="300" cy="480" r="34" fill="url(#stone)"/>
    <circle cx="300" cy="480" r="34" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <path d="M300 458 L308 474 L300 488 L292 474 Z" fill="#fff6dc" opacity="0.85"/>
  </g>

  <!-- right earring -->
  <g style="transform: translate(40px,0)">
    <path d="M500 260 L500 330" stroke="url(#gold)" stroke-width="5"/>
    <circle cx="500" cy="345" r="8" fill="url(#gold)" stroke="url(#gold)" stroke-width="3"/>
    <path d="M470 400 L530 400 L500 640 Z" fill="none" stroke="url(#gold)" stroke-width="6"/>
    <path d="M476 400 L524 400 L500 622 Z" fill="url(#goldV)" opacity="0.8"/>
    <circle cx="500" cy="480" r="34" fill="url(#stone)"/>
    <circle cx="500" cy="480" r="34" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <path d="M500 458 L508 474 L500 488 L492 474 Z" fill="#fff6dc" opacity="0.85"/>
  </g>

  <g fill="url(#gold)">
    <path d="M520 640 l6 12 l12 6 l-12 6 l-6 12 l-6 -12 l-12 -6 l12 -6 Z" opacity="0.8"/>
    <path d="M280 240 l4 8 l8 4 l-8 4 l-4 8 l-4 -8 l-8 -4 l8 -4 Z" opacity="0.6"/>
    <path d="M120 520 l4 8 l8 4 l-8 4 l-4 8 l-4 -8 l-8 -4 l8 -4 Z" opacity="0.5"/>
  </g>

  <!-- simple threader version hint below -->
  <path d="M200 760 C 260 730 300 700 320 650" stroke="url(#gold)" stroke-width="4" fill="none" opacity="0.5"/>
  <path d="M600 760 C 540 730 500 700 480 650" stroke="url(#gold)" stroke-width="4" fill="none" opacity="0.5"/>

  <text x="400" y="860" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="6" fill="#8a6a2b">EARRINGS</text>
  <text x="400" y="895" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="3" fill="#5c4520">placeholder — replace with photography</text>
</svg>