<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" width="900" height="1000">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#211508"/>
      <stop offset="0.55" stop-color="#120c06"/>
      <stop offset="1" stop-color="#0a0705"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a2b"/>
      <stop offset="0.35" stop-color="#e8c87c"/>
      <stop offset="0.55" stop-color="#f7e3a8"/>
      <stop offset="0.75" stop-color="#c9a24b"/>
      <stop offset="1" stop-color="#7a5c24"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1000" fill="url(#bg)"/>

  <!-- construction grid -->
  <g stroke="#e8c87c" stroke-width="1" opacity="0.12">
    <line x1="0" y1="330" x2="900" y2="330"/>
    <line x1="0" y1="660" x2="900" y2="660"/>
    <line x1="300" y1="0" x2="300" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
  </g>

  <!-- sketch ring -->
  <g fill="none" stroke="url(#gold)" stroke-width="3" stroke-dasharray="10 8" opacity="0.9">
    <circle cx="450" cy="430" r="170"/>
    <circle cx="450" cy="430" r="110"/>
  </g>
  <g fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-dasharray="4 8" opacity="0.8">
    <circle cx="450" cy="430" r="140"/>
    <path d="M450 260 L450 190" />
    <path d="M280 430 L210 430" />
    <path d="M620 430 L690 430" />
  </g>
  <circle cx="450" cy="260" r="26" fill="none" stroke="url(#gold)" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M450 190 L450 150" stroke="url(#gold)" stroke-width="4"/>

  <!-- dimension arrows -->
  <g stroke="url(#gold)" stroke-width="2" opacity="0.65">
    <line x1="150" y1="700" x2="240" y2="700"/><line x1="155" y1="690" x2="155" y2="710"/><line x1="235" y1="690" x2="235" y2="710"/>
    <line x1="240" y1="700" x2="330" y2="700"/><path d="M300 694 L330 700 L300 706" fill="none"/>
    <line x1="660" y1="700" x2="750" y2="700"/><path d="M690 694 L660 700 L690 706" fill="none"/><line x1="745" y1="690" x2="745" y2="710"/>
  </g>

  <!-- pencil strokes -->
  <g stroke="url(#gold)" stroke-width="2" opacity="0.4" fill="none">
    <path d="M450 610 Q420 700 450 760 Q480 700 450 610"/>
    <path d="M300 780 Q350 760 380 820"/>
    <path d="M600 760 Q560 800 600 850"/>
  </g>

  <text x="450" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="6" fill="#8a6a2b">CUSTOM DESIGN</text>
  <text x="450" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="14" letter-spacing="3" fill="#5c4520">drawn to your requirement — placeholder</text>
  <text x="450" y="930" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="3" fill="#5c4520">placeholder — replace with photography</text>
</svg>